# Personal site configuration. Theme runtime is provided by pinned gems.
title: blank
first_name: Zhibo
middle_name: null
last_name: Duan
description:
  Zhibo Duan (段智博), first-year Ph.D. student in the College of Computer Science and Technology, Zhejiang University. Research interests in artificial
  intelligence and robotics.
contact_note: The best way to reach me is by email.
footer_text: Powered by <a href="https://jekyllrb.com/">Jekyll</a> and <a href="https://github.com/alshedivat/al-folio">al-folio</a>.
keywords: Zhibo Duan, 段智博, Zhejiang University, artificial intelligence, robotics, embodied intelligence
lang: en
icon: ✦
url: https://bozhistudying233.github.io
baseurl: ""
last_updated: false
navbar_fixed: true
footer_fixed: false
max_width: 930px
theme: al_folio_core
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
search_enabled: false
bib_search: false
protect_email: false
enable_darkmode: true
enable_medium_zoom: true
back_to_top: true
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
include:
  - _pages
exclude:
  - AGENTS.md
  - README.md
  - LICENSE
  - docs/
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules/
  - vendor/
  - al-folio-upgrade-report.md
plugins:
  - jekyll-3rd-party-libraries
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - al_folio_core
  - al_icons
  - al_img_tools
  - al_folio_upgrade
  - al_citations
defaults:
  - scope:
      path: assets
    values:
      sitemap: false
sass:
  style: compressed
jekyll-minifier:
  compress_javascript: false
  compress_css: false
  exclude:
    - robots.txt
scholar:
  last_name:
    - Duan
    - 段
  first_name:
    - Zhibo
    - Z.
    - 智博
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters:
    - latex
    - smallcaps
    - superscript
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending
  sort_by:
    - year
    - month
  order: descending
enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false
filtered_bibtex_keywords:
  - bibtex_show
  - pdf
  - preview
  - website
max_author_limit: 3
more_authors_animation_delay: 10
enable_publication_thumbnails: true
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude: null
imagemagick:
  enabled: false
lazy_loading_images: true
third_party_libraries:
  download: false
  fontawesome:
    integrity:
      css: sha256-MVopmdyC2tYTiJ8wlktf0uh0v4NgT+vNdyVFepi7Q0c=
    url:
      css: https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@{{version}}/css/all.min.css
    version: 7.2.0
  google_fonts:
    url:
      fonts: https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap
  vanilla-back-to-top:
    integrity:
      js: sha256-uMJJ3EoTyfRBoTbR+lrfu1uRQ87RZG8AR3cVNuQVeFg=
    url:
      js: https://cdn.jsdelivr.net/npm/vanilla-back-to-top@{{version}}/dist/vanilla-back-to-top.min.js
    version: 7.2.1
